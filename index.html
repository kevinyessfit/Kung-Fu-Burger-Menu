<style>
:root{
  --orange:#F0641E;
  --orange-dark:#C74A0E;
  --red:#D8291C;
  --yellow:#FFC820;
  --yellow-pale:#FFF3D2;
  --ink:#2A1608;
  --ink-soft:#6B4A31;
  --paper:#FFFFFF;
  --bg:#FFF9F0;
  --line:#F2DFC4;
  --green:#1E9146;
  --green-dark:#177036;

  --r-sm:9px;
  --r-md:13px;
  --r-lg:18px;
  --shadow-sm:0 2px 8px rgba(42,22,8,.09);
  --shadow-md:0 8px 22px rgba(42,22,8,.15);
  --maxw:720px;
  --pad:16px;
  --bar-h:74px;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;overflow-x:hidden;
  padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));
}
img{max-width:100%;height:auto;display:block;}
h1,h2,h3{font-family:"Baloo 2","Baloo",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.2;margin:0;overflow-wrap:break-word;}
button{font:inherit;cursor:pointer;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ================= EN-TÊTE ================= */
.head{
  background:linear-gradient(160deg,var(--orange) 0%,var(--red) 100%);
  color:#FFF;padding:26px 0 22px;text-align:center;
}
.head .kf-logo{
  width:108px;height:auto;margin:0 auto 10px;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.28));
}
.head h1{font-size:clamp(30px,8.6vw,44px);font-weight:800;letter-spacing:-.5px;text-shadow:0 3px 0 rgba(0,0,0,.16);}
.head .zh{font-family:"Baloo 2",sans-serif;font-size:17px;font-weight:700;color:var(--yellow);margin:2px 0 10px;}
.head .sub{font-size:15.5px;color:#FFE9D5;margin:0 auto;max-width:420px;}
.head .infos{
  display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;
  margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:#FFDCC0;
}

/* ================= NAV CATÉGORIES ================= */
.catnav{
  position:sticky;top:0;z-index:30;
  background:rgba(255,249,240,.96);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
}
.catnav-inner{
  display:flex;gap:7px;overflow-x:auto;
  max-width:var(--maxw);margin:0 auto;padding:10px var(--pad);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.catnav-inner::-webkit-scrollbar{display:none;}
.catnav a{
  flex:0 0 auto;text-decoration:none;white-space:nowrap;
  font-family:"Baloo 2",sans-serif;font-weight:700;font-size:14.5px;
  color:var(--ink-soft);background:var(--paper);
  border:2px solid var(--line);border-radius:999px;padding:6px 13px;
  transition:background .15s,color .15s,border-color .15s;
}
.catnav a.on{background:var(--orange);border-color:var(--orange-dark);color:#FFF;}
.catnav a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}

/* ================= CATÉGORIE ================= */
.cat{padding:26px 0 4px;scroll-margin-top:64px;}
.cat-band{
  background:var(--orange);color:#FFF;
  border-radius:var(--r-sm);padding:9px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 3px 0 var(--orange-dark);
  margin-bottom:6px;
}
.cat-band h2{font-size:clamp(21px,5.4vw,26px);font-weight:800;letter-spacing:.3px;}
.cat-band .zh{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:17px;color:var(--yellow);white-space:nowrap;}
.cat-note{font-size:14.5px;color:var(--ink-soft);margin:0 2px 14px;}

/* ================= GRILLE DE PLATS ================= */
/* auto-fill + stretch : les cartes d'une même catégorie s'alignent
   en colonnes régulières et gardent la même hauteur par rangée. */
.grid{
  display:grid;gap:11px;
  grid-template-columns:1fr;
  align-items:stretch;
  margin-bottom:8px;
}
@media (min-width:520px){ .grid{grid-template-columns:repeat(2,1fr);} }

/* La fiche est une rangee : photo a gauche, nom + prix + bouton a droite.
   Sans photo (Snacks, A ajouter) la colonne texte prend toute la largeur. */
.dish{
  display:flex;flex-direction:row;align-items:center;gap:12px;
  background:var(--paper);border:2px solid var(--line);
  border-radius:var(--r-md);padding:12px 13px;
  box-shadow:var(--shadow-sm);
}
.thumb{
  flex:0 0 auto;width:92px;height:92px;align-self:center;
  object-fit:contain;object-position:center;
}
.dish-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.dish-body{flex:0 0 auto;}
.dish h3{
  font-size:17.5px;font-weight:700;color:var(--ink);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.dish .zh{font-family:"Baloo 2",sans-serif;font-size:14px;font-weight:600;color:#A98460;margin-top:1px;}
.dish .desc{font-size:14.8px;color:var(--ink-soft);margin:6px 0 0;line-height:1.45;}
.dish .solo-prix{
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;
  color:var(--red);white-space:nowrap;
}
.dish-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}

.add{
  flex:1 1 120px;min-width:0;
  background:var(--orange);color:#FFF;border:none;
  border-radius:var(--r-sm);padding:10px 12px;
  font-family:"Baloo 2",sans-serif;font-weight:700;font-size:15px;
  box-shadow:0 3px 0 var(--orange-dark);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .1s,box-shadow .1s,background .1s;
}
.add:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-dark);}
.add:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
.add .sz{
  background:rgba(255,255,255,.24);border-radius:5px;
  padding:1px 6px;font-size:12.5px;letter-spacing:.4px;
}
.qty-badge:not(:empty){display:inline-flex;}
.add.ok{background:var(--green);box-shadow:0 3px 0 var(--green-dark);}
.dish.in .dish-actions{border-top:1px dashed var(--line);padding-top:10px;}

.qty-badge{
  display:none;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;margin-left:6px;
  background:var(--yellow);color:var(--ink);border-radius:999px;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:13px;
}

/* ================= BARRE PANIER ================= */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--ink);color:#FFF;
  padding:11px var(--pad) calc(11px + env(safe-area-inset-bottom));
  transform:translateY(120%);transition:transform .22s ease;
  box-shadow:0 -6px 20px rgba(0,0,0,.22);
}
.bar.show{transform:translateY(0);}
.bar-inner{
  max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:center;gap:12px;
}
.bar-sum{flex:1 1 auto;min-width:0;}
.bar-sum b{font-family:"Baloo 2",sans-serif;font-size:19px;display:block;line-height:1.15;}
.bar-sum span{font-size:13.5px;color:#D9BFA7;}
.bar-btn{
  flex:0 0 auto;background:var(--yellow);color:var(--ink);border:none;
  border-radius:var(--r-sm);padding:12px 18px;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:16px;
  box-shadow:0 3px 0 #C79A00;
}
.bar-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #C79A00;}

/* ================= PANIER (feuille) ================= */
.sheet-bg{
  position:fixed;inset:0;z-index:50;background:rgba(42,22,8,.55);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.sheet-bg.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
  max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.22,.8,.3,1);
  box-shadow:0 -10px 34px rgba(0,0,0,.3);
}
.sheet.show{transform:translateY(0);}
.sheet-head{
  display:flex;align-items:center;gap:12px;
  padding:16px var(--pad) 12px;border-bottom:2px solid var(--line);
}
.sheet-head h2{flex:1 1 auto;font-size:21px;font-weight:800;}
.x{
  background:var(--paper);border:2px solid var(--line);border-radius:999px;
  width:34px;height:34px;font-size:19px;line-height:1;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.sheet-body{overflow-y:auto;padding:14px var(--pad);-webkit-overflow-scrolling:touch;}
.sheet-foot{
  border-top:2px solid var(--line);background:var(--paper);
  padding:14px var(--pad) calc(14px + env(safe-area-inset-bottom));
}

.line{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--paper);border:2px solid var(--line);
  border-radius:var(--r-md);padding:11px 12px;margin-bottom:9px;
}
.line-info{flex:1 1 auto;min-width:0;}
.line-nom{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:16px;line-height:1.25;}
.line-meta{font-size:13.5px;color:var(--ink-soft);}
.line-tot{font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--red);white-space:nowrap;}
.stepper{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.stepper button{
  width:32px;height:32px;border-radius:8px;border:2px solid var(--line);
  background:var(--paper);font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:17px;line-height:1;color:var(--orange-dark);
  display:flex;align-items:center;justify-content:center;
}
.stepper button:active{background:var(--yellow-pale);}
.stepper .n{font-family:"Baloo 2",sans-serif;font-weight:800;min-width:18px;text-align:center;}

.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;}
.empty b{display:block;font-family:"Baloo 2",sans-serif;font-size:18px;color:var(--ink);margin-bottom:4px;}

.field{margin-bottom:11px;}
.field label{
  display:block;font-family:"Baloo 2",sans-serif;font-weight:700;
  font-size:14px;margin-bottom:5px;color:var(--ink);
}
.field input,.field textarea,.field select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--bg);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;
}
.field textarea{min-height:64px;resize:vertical;}
.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid var(--yellow);outline-offset:1px;border-color:var(--orange);}
.modes{display:flex;gap:8px;}
.modes label{
  flex:1 1 0;text-align:center;background:var(--bg);
  border:2px solid var(--line);border-radius:var(--r-sm);
  padding:9px 6px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:14.5px;
  color:var(--ink-soft);cursor:pointer;
}
.modes input{position:absolute;opacity:0;pointer-events:none;}
.modes input:checked + span{color:#FFF;}
.modes label:has(input:checked){background:var(--orange);border-color:var(--orange-dark);color:#FFF;}
.modes label:focus-within{outline:3px solid var(--yellow);outline-offset:1px;}

.totals{
  display:flex;align-items:baseline;justify-content:space-between;
  font-family:"Baloo 2",sans-serif;margin:4px 0 12px;
}
.totals .lbl{font-weight:700;font-size:16px;}
.totals .val{font-weight:800;font-size:26px;color:var(--red);}

.send{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;background:var(--green);color:#FFF;border:none;
  border-radius:var(--r-md);padding:15px 16px;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;
  box-shadow:0 4px 0 var(--green-dark);text-decoration:none;
}
.send:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark);}
.send[aria-disabled="true"]{background:#B9A48E;box-shadow:0 4px 0 #93816E;pointer-events:none;}
.send-note{font-size:13px;color:var(--ink-soft);text-align:center;margin:9px 0 0;}
.call{
  display:block;text-align:center;margin-top:10px;color:var(--orange-dark);
  font-family:"Baloo 2",sans-serif;font-weight:700;font-size:15px;
}

/* ================= PIED ================= */
footer{
  background:var(--ink);color:#C7A98D;text-align:center;
  font-size:14px;padding:24px var(--pad) 30px;margin-top:26px;
}
footer p{margin:0 0 6px;}
footer a{color:var(--yellow);font-weight:700;}
.nojs{
  background:#FFE9E5;border:2px solid #F3C3B9;color:#9C2A18;
  border-radius:var(--r-md);padding:14px;margin:20px 0;
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition:none!important;animation:none!important;}
}
</style>
</head>

<header class="head">

<!-- Feuille panier -->
<div class="sheet-bg" id="sheet-bg"></div>

        <label for="f-note">Une précision ? (facultatif)</label>
        <textarea id="f-note" placeholder="Ex : sans piment, bien cuit…"></textarea>
      </div>

  </div>
  <div class="sheet-foot">

  </div>
</section>

      { img:"burger-bacon", nom:"Burger Bacon",             zh:"芝士培根牛肉堡", prix:3500 },

    ]

  {

  {

    note:"À grignoter, seul ou à partager.",

/* =====================================================================
   3. LE MENU ET LA COMMANDE — rien à modifier en dessous
   ===================================================================== */
(function(){
  const $  = (id) => document.getElementById(id);
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };
  const money = (v) =>
    v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + CONFIG.devise;

  const STORE = "kfb-panier-v1";
  let panier = {};                       // cle -> {nom, taille, prix, qte}
  let mode = CONFIG.modes[0];

  try { panier = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ panier = {}; }

  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(panier)); } catch(e){} };

  /* ---------- En-tête ---------- */
  document.title = "Menu — " + CONFIG.nom;
  $("h-nom").textContent = CONFIG.nom;
  $("h-zh").textContent  = CONFIG.zh;
  $("h-sub").textContent = CONFIG.sousTitre;
  CONFIG.infos.forEach(i => $("h-infos").appendChild(el("li", null, i)));
  $("f-nom").textContent = CONFIG.nom + " — " + CONFIG.kicker;
  if (CONFIG.telephone){
    const a = el("a", null, CONFIG.telephone);
    a.href = "tel:" + CONFIG.telephone.replace(/[^\d+]/g, "");
    $("f-tel").append("Tél : ", a);
    $("call").href = a.href;
    $("call").textContent = "ou appeler le " + CONFIG.telephone;
  }
  if (CONFIG.tiktok) $("f-tiktok").textContent = "TikTok : " + CONFIG.tiktok;

  /* ---------- Construction de la carte ---------- */
  const carte = $("carte"), nav = $("catnav");
  const boutons = {};                     // cle -> [bouton, …]

  CARTE.forEach(cat => {
    const secId = "cat-" + cat.id;

    const lien = el("a", null, cat.titre);
    lien.href = "#" + secId;
    nav.appendChild(lien);

    const sec = el("section", "cat");
    sec.id = secId;

    const band = el("div", "cat-band");
    band.appendChild(el("h2", null, cat.titre));
    if (cat.zh) band.appendChild(el("span", "zh", cat.zh));
    sec.appendChild(band);
    if (cat.note) sec.appendChild(el("p", "cat-note", cat.note));

    const grid = el("div", "grid");

    cat.items.forEach((it, i) => {
      const dispo   = it.dispo !== false;
      const tailles = cat.tailles || null;
      const prixArr = Array.isArray(it.prix) ? it.prix : [it.prix];

      const card = el("article", "dish");

      if (it.img){
        const im = el("img", "thumb");
        im.src = "images/" + it.img + ".webp";
        im.alt = it.nom;
        im.width = 86; im.height = 86;
        im.loading = "lazy"; im.decoding = "async";
        // si l'image manque, la fiche reste lisible sans trou
        im.addEventListener("error", () => im.remove());
        card.appendChild(im);
      }

      const col = el("div", "dish-col");

      const body = el("div", "dish-body");

      const h = el("h3");
      h.appendChild(el("span", null, it.nom));
      if (!tailles) h.appendChild(el("span", "solo-prix", money(prixArr[0])));
      body.appendChild(h);
      if (it.zh)   body.appendChild(el("p", "zh", it.zh));
      if (it.desc) body.appendChild(el("p", "desc", it.desc));
      if (!dispo)  body.appendChild(el("p", "desc", "Épuisé aujourd'hui"));
      col.appendChild(body);
      card.appendChild(col);

      if (dispo){
        const acts = el("div", "dish-actions");
        prixArr.forEach((p, k) => {
          const taille = tailles ? tailles[k] : null;
          const cle = cat.id + "/" + i + (taille ? "/" + k : "");

          const b = el("button", "add");
          b.type = "button";
          b.dataset.cle = cle;
          const label = el("span");
          if (taille){
            label.appendChild(el("span", "sz", taille));
            label.append(" " + money(p));
          } else {
            label.textContent = "Ajouter";
          }
          b.appendChild(label);
          b.appendChild(el("span", "qty-badge"));

          b.addEventListener("click", () => {
            const cur = panier[cle] || { nom: it.nom, taille: taille, prix: p, qte: 0 };
            cur.prix = p;                         // suit le prix de la carte
            cur.qte += 1;
            panier[cle] = cur;
            majPanier();
            b.classList.add("ok");
            setTimeout(() => b.classList.remove("ok"), 450);
          });

          (boutons[cle] = boutons[cle] || []).push(b);
          acts.appendChild(b);
        });
        col.appendChild(acts);
      }

      grid.appendChild(card);
    });

    sec.appendChild(grid);
    carte.appendChild(sec);
  });

  /* ---------- Modes de service ---------- */
  const modesBox = $("modes");
  CONFIG.modes.forEach((m, i) => {
    const lab = el("label");
    const inp = el("input");
    inp.type = "radio"; inp.name = "mode"; inp.value = m; inp.checked = i === 0;
    inp.addEventListener("change", () => {
      mode = m;
      $("f-addr-wrap").hidden = !/livraison/i.test(m);
      majLien();
    });
    lab.appendChild(inp);
    lab.appendChild(el("span", null, m));
    modesBox.appendChild(lab);
  });

  /* ---------- Calculs ---------- */
  const lignes = () => Object.keys(panier).map(c => Object.assign({ cle: c }, panier[c]));
  const total  = () => lignes().reduce((s, l) => s + l.prix * l.qte, 0);
  const nbArt  = () => lignes().reduce((s, l) => s + l.qte, 0);

  function texteCommande(){
    const L = lignes();
    let t = "Bonjour " + CONFIG.nom + " ! Je voudrais commander :\n\n";
    L.forEach(l => {
      t += "• " + l.qte + " x " + l.nom
         + (l.taille ? " (" + l.taille + ")" : "")
         + " — " + money(l.prix * l.qte) + "\n";
    });
    t += "\nTOTAL : " + money(total()) + "\n";
    t += "Service : " + mode + "\n";
    const nom  = $("f-name").value.trim();
    const addr = $("f-addr").value.trim();
    const note = $("f-note").value.trim();
    if (nom)  t += "Nom : " + nom + "\n";
    if (addr && /livraison/i.test(mode)) t += "Adresse : " + addr + "\n";
    if (note) t += "Note : " + note + "\n";
    return t;
  }

  function majLien(){
    const send = $("send");
    if (!nbArt() || !CONFIG.whatsapp){
      send.setAttribute("aria-disabled", "true");
      send.removeAttribute("href");
      return;
    }
    send.removeAttribute("aria-disabled");
    send.href = "https://wa.me/" + CONFIG.whatsapp
              + "?text=" + encodeURIComponent(texteCommande());
  }

  /* ---------- Rendu du panier ---------- */
  function majPanier(){
    save();
    const L = lignes(), n = nbArt(), t = total();

    // badges sur les boutons de la carte
    Object.keys(boutons).forEach(cle => {
      const q = panier[cle] ? panier[cle].qte : 0;
      boutons[cle].forEach(b => {
        b.querySelector(".qty-badge").textContent = q ? q : "";
        b.closest(".dish").classList.toggle("in", q > 0);
      });
    });

    // barre du bas
    $("bar").classList.toggle("show", n > 0);
    $("bar-tot").textContent = money(t);
    $("bar-qte").textContent = n + (n > 1 ? " articles" : " article");

    // lignes de la feuille
    const box = $("lines");
    box.textContent = "";
    if (!L.length){
      const e = el("div", "empty");
      e.appendChild(el("b", null, "Ton panier est vide"));
      e.appendChild(el("span", null, "Ajoute un plat depuis la carte pour commander."));
      box.appendChild(e);
      $("form").hidden = true;
    } else {
      L.forEach(l => {
        const row = el("div", "line");
        const info = el("div", "line-info");
        info.appendChild(el("p", "line-nom", l.nom));
        info.appendChild(el("p", "line-meta",
          (l.taille ? l.taille + " · " : "") + money(l.prix) + " l'unité"));
        row.appendChild(info);

        const st = el("div", "stepper");
        const moins = el("button", null, "−"); moins.type = "button";
        moins.setAttribute("aria-label", "Retirer un " + l.nom);
        const n2 = el("span", "n", String(l.qte));
        const plus = el("button", null, "+"); plus.type = "button";
        plus.setAttribute("aria-label", "Ajouter un " + l.nom);
        moins.addEventListener("click", () => {
          if (--panier[l.cle].qte <= 0) delete panier[l.cle];
          majPanier();
        });
        plus.addEventListener("click", () => { panier[l.cle].qte++; majPanier(); });
        st.append(moins, n2, plus);
        row.appendChild(st);

        row.appendChild(el("span", "line-tot", money(l.prix * l.qte)));
        box.appendChild(row);
      });
      $("form").hidden = false;
    }

    $("s-tot").textContent = money(t);
    majLien();
  }

  /* ---------- Ouverture / fermeture de la feuille ---------- */
  const sheet = $("sheet"), bg = $("sheet-bg");
  let lastFocus = null;

  function ouvrir(){
    lastFocus = document.activeElement;
    sheet.hidden = false;
    requestAnimationFrame(() => { sheet.classList.add("show"); bg.classList.add("show"); });
    document.body.style.overflow = "hidden";
    $("sheet-x").focus();
  }
  function fermer(){
    sheet.classList.remove("show"); bg.classList.remove("show");
    document.body.style.overflow = "";
    setTimeout(() => { sheet.hidden = true; }, 260);
    if (lastFocus) lastFocus.focus();
  }
  $("bar-open").addEventListener("click", ouvrir);
  $("sheet-x").addEventListener("click", fermer);
  bg.addEventListener("click", fermer);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !sheet.hidden) fermer();
  });
  ["f-name","f-addr","f-note"].forEach(id => $(id).addEventListener("input", majLien));
  $("send").addEventListener("click", () => setTimeout(fermer, 400));

  /* ---------- Catégorie visible ---------- */
  const liens = Array.from(nav.querySelectorAll("a"));
  const secs  = liens.map(a => document.querySelector(a.getAttribute("href")));
  let actif = -1, tick = false;
  function majNav(){
    tick = false;
    // + marge : les sections ont un scroll-margin-top, une catégorie visée
    // s'arrête donc juste sous la barre de navigation.
    const seuil = nav.getBoundingClientRect().bottom + 28;
    let i = 0;
    secs.forEach((s, j) => { if (s && s.getBoundingClientRect().top <= seuil) i = j; });
    if (i === actif) return;
    actif = i;
    liens.forEach((a, j) => a.classList.toggle("on", i === j));
    const a = liens[i], box = nav.getBoundingClientRect(), p = a.getBoundingClientRect();
    if (p.left < box.left || p.right > box.right){
      nav.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
    }
  }
  addEventListener("scroll", () => {
    if (!tick){ tick = true; requestAnimationFrame(majNav); }
  }, { passive: true });
  addEventListener("resize", majNav, { passive: true });
  majNav();

  majPanier();
})();
</script>
