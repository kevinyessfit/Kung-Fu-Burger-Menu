<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — COOKIES BUSINESS</title>
<meta name="description" content="Le menu du jour : cookies maison, boissons et formules. Scanne, choisis, commande.">
<meta name="theme-color" content="#3A2318">
<meta property="og:title" content="Menu — COOKIES BUSINESS">
<meta property="og:description" content="Cookies maison, boissons et formules. Scanne, choisis, commande.">
<meta property="og:type" content="website">
<meta property="og:image" content="cookies-business-cover.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --choco:#3A2318;
  --choco-soft:#5C3A26;
  --caramel:#C9762C;
  --caramel-dark:#A85D1E;
  --honey:#E3A23D;
  --cream:#FBF3E7;
  --cream-deep:#F3E2C7;
  --paper:#FFFDF9;
  --text:#2B1B12;

  --r-sm:8px;
  --r-md:11px;
  --r-lg:14px;
  --shadow-sm:0 2px 8px rgba(58,35,24,.08);
  --shadow-md:0 6px 18px rgba(58,35,24,.12);
  --maxw:640px;
  --pad:20px;
  --nav-h:58px;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px;
  line-height:1.6;
  overflow-x:hidden;
}
img{max-width:100%;height:auto;display:block;}
h1,h2,h3{font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.22;margin:0 0 12px;color:var(--choco);overflow-wrap:break-word;}
h1{font-size:clamp(28px,7.6vw,40px);font-weight:800;letter-spacing:-.5px;}
h2{font-size:clamp(21px,5.6vw,27px);font-weight:700;}
h3{font-size:18px;font-weight:700;}
p{margin:0 0 14px;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);}

/* ============ BANDEAU BROUILLON ============ */
.draft{
  background:#9C4127;color:#FFF3EE;
  font-family:"Poppins",sans-serif;font-weight:700;font-size:13.5px;
  text-align:center;padding:10px var(--pad);line-height:1.4;
}

/* ============ EN-TÊTE ============ */
.head{
  background:linear-gradient(168deg,var(--choco) 0%,#4A2D1E 62%,var(--choco-soft) 100%);
  color:var(--cream);
  padding:34px 0 30px;
  text-align:center;
}
.head h1{color:var(--paper);margin-bottom:6px;}
.head .badge{
  display:inline-block;background:rgba(227,162,61,.18);
  border:1px solid rgba(227,162,61,.5);color:var(--honey);
  font-family:"Poppins",sans-serif;font-weight:700;font-size:12.5px;
  letter-spacing:1.2px;text-transform:uppercase;
  padding:6px 14px;border-radius:999px;margin-bottom:16px;
}
.head .slogan{color:#EFE0CC;font-size:16.5px;max-width:460px;margin:0 auto;}
.head .infos{
  display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;
  margin:18px 0 0;padding:0;list-style:none;
  font-size:14.5px;color:#DFCDB6;
}

/* ============ NAV CATÉGORIES ============ */
.catnav{
  position:sticky;top:0;z-index:20;
  background:rgba(251,243,231,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--cream-deep);
}
.catnav-inner{
  display:flex;gap:8px;overflow-x:auto;
  max-width:var(--maxw);margin:0 auto;
  padding:11px var(--pad);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.catnav-inner::-webkit-scrollbar{display:none;}
.catnav a{
  flex:0 0 auto;text-decoration:none;
  font-family:"Poppins",sans-serif;font-weight:600;font-size:14.5px;
  color:var(--choco-soft);background:var(--paper);
  border:1px solid var(--cream-deep);border-radius:999px;
  padding:7px 14px;white-space:nowrap;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.catnav a.on{background:var(--choco);border-color:var(--choco);color:var(--paper);}
.catnav a:focus-visible{outline:3px solid var(--honey);outline-offset:2px;}

/* ============ CATÉGORIES & PLATS ============ */
.cat{padding:34px 0 6px;scroll-margin-top:calc(var(--nav-h) + 10px);}
.cat + .cat{padding-top:26px;}
.cat-head{margin-bottom:16px;}
.cat-head .eyebrow{
  font-family:"Poppins",sans-serif;font-weight:700;font-size:12.5px;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--caramel-dark);
  margin:0 0 6px;
}
.cat-head h2{margin-bottom:4px;}
.cat-head .note{font-size:15.5px;color:var(--choco-soft);margin:0;}

.item{
  background:var(--paper);
  border:1px solid var(--cream-deep);
  border-radius:var(--r-lg);
  padding:15px 16px;
  margin-bottom:11px;
  box-shadow:var(--shadow-sm);
}
.item-top{display:flex;align-items:baseline;gap:12px;}
.item-nom{
  font-family:"Poppins",sans-serif;font-weight:700;font-size:17.5px;
  color:var(--choco);margin:0;flex:1 1 auto;line-height:1.3;
}
.item-prix{
  font-family:"Poppins",sans-serif;font-weight:800;font-size:17px;
  color:var(--caramel-dark);white-space:nowrap;flex:0 0 auto;
}
.item-desc{margin:6px 0 0;font-size:16px;color:var(--choco-soft);line-height:1.5;}
.item-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;padding:0;list-style:none;}
.tag{
  font-family:"Poppins",sans-serif;font-weight:700;font-size:11.5px;
  letter-spacing:.7px;text-transform:uppercase;
  background:var(--cream-deep);color:var(--choco-soft);
  border-radius:999px;padding:4px 10px;
}
.tag.star{background:var(--honey);color:var(--choco);}
.item.indispo{opacity:.55;}
.item.indispo .item-prix{text-decoration:line-through;}

/* ============ COMMANDE ============ */
.order{
  background:var(--cream-deep);
  padding:34px 0;
  text-align:center;
  margin-top:30px;
}
.order h2{margin-bottom:8px;}
.order p{color:var(--choco-soft);font-size:16px;max-width:460px;margin:0 auto 18px;}
.cta{
  display:block;width:100%;max-width:420px;margin:0 auto;
  background:linear-gradient(180deg,var(--caramel) 0%,var(--caramel-dark) 100%);
  color:#FFF;text-decoration:none;text-align:center;
  font-family:"Poppins",sans-serif;font-weight:700;font-size:17px;line-height:1.35;
  padding:16px 18px;border-radius:var(--r-md);
  box-shadow:0 5px 0 #8C4C16, var(--shadow-md);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #8C4C16, var(--shadow-sm);}
.cta:focus-visible{outline:3px solid var(--honey);outline-offset:3px;}
.cta.wa{background:linear-gradient(180deg,#2FB457 0%,#1E9146 100%);box-shadow:0 5px 0 #177036, var(--shadow-md);}
.cta + .cta{margin-top:12px;}

/* ============ PIED DE PAGE ============ */
footer{
  background:var(--choco);color:#B9A48E;
  text-align:center;font-size:14px;padding:26px var(--pad) 34px;
}
footer p{margin:0 0 6px;}
footer a{color:var(--honey);}
.maj{font-size:13px;color:#96826D;}

.nojs{
  background:#FBEDEA;border:1px solid #F0D4CD;color:#7A4536;
  border-radius:var(--r-md);padding:14px 16px;margin:24px 0;font-size:16px;
}

@media (min-width:560px){
  .head{padding:44px 0 38px;}
  .cat{padding-top:44px;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition:none!important;animation:none!important;}
}
</style>
</head>
<body>

<!-- =====================================================================
     MENU DIGITAL — COOKIES BUSINESS
     =====================================================================
     TOUT LE CONTENU DU MENU SE MODIFIE DANS LE BLOC <script> EN BAS DE
     CETTE PAGE (constantes CONFIG et MENU). Aucune autre partie du fichier
     n'a besoin d'être touchée pour changer un prix, un plat ou une
     catégorie.
     ===================================================================== -->

<div id="draft"></div>

<header class="head">
  <div class="wrap">
    <span class="badge" id="head-badge"></span>
    <h1 id="head-nom"></h1>
    <p class="slogan" id="head-slogan"></p>
    <ul class="infos" id="head-infos"></ul>
  </div>
</header>

<nav class="catnav" aria-label="Catégories du menu">
  <div class="catnav-inner" id="catnav"></div>
</nav>

<main class="wrap" id="menu">
  <noscript>
    <div class="nojs">
      <strong>Active JavaScript</strong> pour afficher le menu, ou demande la
      carte papier au comptoir.
    </div>
  </noscript>
</main>

<section class="order" id="order" hidden>
  <div class="wrap">
    <h2>Passer commande</h2>
    <p id="order-note"></p>
    <a class="cta wa" id="order-wa" href="#" hidden>Commander sur WhatsApp</a>
    <a class="cta" id="order-tel" href="#" hidden>Appeler pour commander</a>
  </div>
</section>

<footer>
  <p id="foot-nom"></p>
  <p id="foot-adresse"></p>
  <p class="maj" id="foot-maj"></p>
</footer>

<script>
/* =====================================================================
   1. CONFIGURATION DE LA BOUTIQUE
   ===================================================================== */
const CONFIG = {
  nom:      "COOKIES BUSINESS",
  badge:    "Menu du jour",
  slogan:   "Cookies maison cuits le jour même, préparés à la commande.",
  devise:   "FCFA",

  // Infos affichées sous le titre. Laisse un tableau vide [] pour ne rien afficher.
  infos: [
    "Ouvert 9h – 20h",
    "Commande 30 min à l'avance",
    "Livraison possible"
  ],

  // Numéro WhatsApp au format international SANS le "+" ni espaces.
  // Exemple Côte d'Ivoire : "2250102030405". Laisse "" pour masquer le bouton.
  whatsapp: "",

  // Numéro de téléphone à appeler. Laisse "" pour masquer le bouton.
  telephone: "",

  // Message pré-rempli dans WhatsApp quand le client clique.
  messageWhatsapp: "Bonjour ! Je souhaite commander depuis le menu en ligne :",

  adresse: "",
  derniereMaj: "28/08/2026",

  // Mets false quand le menu réel est en place : le bandeau rouge disparaît.
  brouillon: true
};

/* =====================================================================
   2. LE MENU
   ---------------------------------------------------------------------
   Une catégorie = { titre, note, items: [...] }
   Un article    = { nom, desc, prix, tags, dispo }
       prix  : un nombre (4900) OU un texte libre ("dès 2 500")
       tags  : facultatif — ["Best-seller"], ["Nouveau"], ["Sans four"]…
               le premier tag est mis en avant en doré
       dispo : mets false pour afficher l'article en "épuisé"
   ===================================================================== */
const MENU = [
  {
    titre: "Cookies à l'unité",
    note:  "Cuits le matin même, vendus à la pièce.",
    items: [
      { nom: "Cookie chocolat noir",        desc: "Pépites de chocolat noir, cœur fondant.",           prix: 500,  tags: ["Best-seller"] },
      { nom: "Cookie chocolat-noisette",    desc: "Chocolat au lait et éclats de noisettes torréfiées.", prix: 600 },
      { nom: "Cookie caramel beurre salé",  desc: "Caramel coulant, fleur de sel.",                    prix: 700,  tags: ["Nouveau"] },
      { nom: "Cookie fourré chocolat",      desc: "Cookie épais garni d'un cœur de pâte à tartiner.",  prix: 800 },
      { nom: "Cookie coco",                 desc: "Noix de coco râpée et chocolat blanc.",             prix: 600,  dispo: false }
    ]
  },
  {
    titre: "Boîtes & assortiments",
    note:  "Pour la maison, le bureau ou les réceptions.",
    items: [
      { nom: "Boîte de 6 cookies",   desc: "Assortiment au choix, emballage cadeau offert.",    prix: 3000 },
      { nom: "Boîte de 12 cookies",  desc: "Assortiment au choix, idéale pour le bureau.",      prix: 5500, tags: ["Le plus commandé"] },
      { nom: "Plateau réception 30", desc: "30 cookies assortis, sur commande 48 h à l'avance.", prix: 13000 }
    ]
  },
  {
    titre: "Boissons",
    note:  "",
    items: [
      { nom: "Café noir",        desc: "Expresso serré ou allongé.",       prix: 500 },
      { nom: "Chocolat chaud",   desc: "Chocolat fondu, lait entier.",     prix: 1000 },
      { nom: "Jus de bissap",    desc: "Fait maison, servi bien frais.",   prix: 750 },
      { nom: "Eau minérale",     desc: "50 cl.",                           prix: 300 }
    ]
  },
  {
    titre: "Formules",
    note:  "L'économie la plus simple de la carte.",
    items: [
      { nom: "Formule pause",   desc: "2 cookies au choix + 1 boisson chaude.", prix: 1500, tags: ["Économie 300 FCFA"] },
      { nom: "Formule partage", desc: "Boîte de 6 + 2 boissons au choix.",      prix: 4200 }
    ]
  }
];

/* =====================================================================
   3. AFFICHAGE — rien à modifier en dessous de cette ligne
   ===================================================================== */
(function(){
  const $ = (id) => document.getElementById(id);

  // 4900 -> "4 900 FCFA" ; "dès 2 500" reste tel quel.
  function prix(v){
    if (typeof v !== "number") return String(v);
    return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + CONFIG.devise;
  }

  function slug(t){
    return t.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function el(tag, cls, txt){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  /* --- En-tête --- */
  document.title = "Menu — " + CONFIG.nom;
  $("head-nom").textContent = CONFIG.nom;
  $("head-slogan").textContent = CONFIG.slogan;
  $("foot-nom").textContent = CONFIG.nom;

  const badge = $("head-badge");
  if (CONFIG.badge) badge.textContent = CONFIG.badge; else badge.hidden = true;

  const infos = $("head-infos");
  (CONFIG.infos || []).forEach(i => infos.appendChild(el("li", null, i)));

  if (CONFIG.brouillon){
    const d = el("div", "draft",
      "Menu de démonstration — les articles et les prix ci-dessous sont des exemples, "
      + "en attente du menu réel.");
    $("draft").replaceWith(d);
  } else {
    $("draft").remove();
  }

  if (CONFIG.adresse) $("foot-adresse").textContent = CONFIG.adresse;
  if (CONFIG.derniereMaj) $("foot-maj").textContent = "Carte mise à jour le " + CONFIG.derniereMaj;

  /* --- Catégories et articles --- */
  const menu = $("menu");
  const nav  = $("catnav");

  MENU.forEach(cat => {
    const id = "cat-" + slug(cat.titre);

    const lien = el("a", null, cat.titre);
    lien.href = "#" + id;
    nav.appendChild(lien);

    const sec = el("section", "cat");
    sec.id = id;

    const head = el("div", "cat-head");
    head.appendChild(el("p", "eyebrow", "Notre carte"));
    head.appendChild(el("h2", null, cat.titre));
    if (cat.note) head.appendChild(el("p", "note", cat.note));
    sec.appendChild(head);

    (cat.items || []).forEach(it => {
      const dispo = it.dispo !== false;
      const art = el("article", "item" + (dispo ? "" : " indispo"));

      const top = el("div", "item-top");
      top.appendChild(el("h3", "item-nom", it.nom));
      top.appendChild(el("span", "item-prix", prix(it.prix)));
      art.appendChild(top);

      if (it.desc) art.appendChild(el("p", "item-desc", it.desc));

      const tags = (it.tags || []).slice();
      if (!dispo) tags.unshift("Épuisé aujourd'hui");
      if (tags.length){
        const ul = el("ul", "item-tags");
        tags.forEach((t, i) => ul.appendChild(el("li", "tag" + (i === 0 ? " star" : ""), t)));
        art.appendChild(ul);
      }

      sec.appendChild(art);
    });

    menu.appendChild(sec);
  });

  /* --- Boutons de commande --- */
  const order = $("order");
  let boutons = 0;

  if (CONFIG.whatsapp){
    const a = $("order-wa");
    a.href = "https://wa.me/" + CONFIG.whatsapp
           + "?text=" + encodeURIComponent(CONFIG.messageWhatsapp);
    a.hidden = false;
    boutons++;
  }
  if (CONFIG.telephone){
    const a = $("order-tel");
    a.href = "tel:" + CONFIG.telephone.replace(/\s+/g, "");
    a.textContent = "Appeler " + CONFIG.telephone;
    a.hidden = false;
    boutons++;
  }
  if (boutons){
    $("order-note").textContent =
      "Dis-nous ce qui te fait envie, on prépare ta commande.";
    order.hidden = false;
  }

  /* --- Surlignage de la catégorie visible --- */
  const liens = Array.from(nav.querySelectorAll("a"));
  const sections = liens.map(a => document.querySelector(a.getAttribute("href")));

  if ("IntersectionObserver" in window){
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const i = sections.indexOf(e.target);
        if (i < 0) return;
        liens.forEach((a, j) => a.classList.toggle("on", i === j));
        const a = liens[i];
        const box = nav.getBoundingClientRect();
        const pos = a.getBoundingClientRect();
        if (pos.left < box.left || pos.right > box.right){
          nav.scrollTo({ left: a.offsetLeft - 20, behavior: "smooth" });
        }
      });
    }, { rootMargin: "-70px 0px -65% 0px", threshold: 0 });
    sections.forEach(s => s && io.observe(s));
  }
  if (liens[0]) liens[0].classList.add("on");
})();
</script>

</body>
</html>
