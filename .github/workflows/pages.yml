# Publie le menu sur GitHub Pages a chaque push sur main.
#
# L'etape configure-pages avec "enablement: true" active Pages toute seule
# au premier passage : aucun reglage a faire a la main dans Settings.
name: Publier le menu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois, sans annuler celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparer le site
        # On ne publie que ce que le client doit recevoir : ni .git,
        # ni le README, ni les outils de generation du QR.
        run: |
          mkdir -p _site
          cp index.html qr.html favicon.png og-image.jpg menu-qr.svg menu-qr.png _site/
          cp -r images _site/images
          cp -r fonts _site/fonts
          ls -R _site | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployer
        id: deploiement
        uses: actions/deploy-pages@v4
